<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }

        .video-page {
            min-height: 100vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            padding: 40px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .video-wrapper {
            width: 90%;
            max-width: 1000px;
            aspect-ratio: 16 / 9;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .back-button {
            display: inline-block;

            margin-top: 30px;

            padding: 12px 25px;

            background: #34495e;
            color: white;

            text-decoration: none;

            border-radius: 5px;

            transition: 0.3s;
        }

        .back-button:hover {
            background: #4b6580;
        }
    </style>

</head>

<body>

    <div class="video-page">



        <div class="video-mask">

    <a href="https://www.youtube.com/watch?v=QeV2-GXI3IE"
       class="play"
       target="_blank">
    </a>

</div>
    </div>

</body>

</html>
